<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مِحراب الحُفّاظ — جاري التحميل...</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#0d3b2e;color:#f3d77c;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .box{text-align:center;padding:24px}
  </style>
</head>
<body>
  <div class="box" id="boot">جاري تحميل مِحراب الحُفّاظ...</div>
  <script>
  (async function() {
    try {
      const n = 4;
      for (let i = 0; i < n; i++) {
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = './payload.' + i + '.js';
          s.onload = resolve; s.onerror = reject;
          document.head.appendChild(s);
        });
      }
      const b64 = (window.__MIHRAB_PAYLOAD || []).join('');
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const ds = new DecompressionStream('gzip');
      const stream = new Blob([bytes]).stream().pipeThrough(ds);
      const plain = await new Response(stream).text();
      document.open();
      document.write(plain);
      document.close();
    } catch (e) {
      console.error(e);
      document.getElementById('boot').textContent = 'تعذر التحميل: ' + e;
    }
  })();
  </script>
</body>
</html>
