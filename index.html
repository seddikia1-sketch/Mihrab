<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مِحراب الحُفّاظ — جاري التحميل...</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#0d3b2e;color:#f3d77c;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .box{text-align:center;padding:24px;max-width:420px;line-height:1.7}
    a{color:#f3d77c}
  </style>
</head>
<body>
  <div class="box" id="boot">جاري تحميل مِحراب الحُفّاظ...</div>
  <script>
  (async function () {
    var boot = document.getElementById('boot');
    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = src;
        s.onload = function () { resolve(true); };
        s.onerror = function () { resolve(false); };
        document.head.appendChild(s);
      });
    }
    try {
      // Try gzip payloads first (only if all 4 load and look valid)
      var ok = true;
      for (var i = 0; i < 4; i++) {
        var loaded = await loadScript('./payload.' + i + '.js');
        if (!loaded) { ok = false; break; }
      }
      var b64 = (window.__MIHRAB_PAYLOAD || []).join('');
      if (ok && b64 && b64.length > 10000 && b64.indexOf('PLACEHOLDER') === -1) {
        try {
          var bin = atob(b64);
          var bytes = new Uint8Array(bin.length);
          for (var j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
          var ds = new DecompressionStream('gzip');
          var stream = new Blob([bytes]).stream().pipeThrough(ds);
          var plain = await new Response(stream).text();
          if (plain && plain.indexOf('loadMushafHizb') !== -1) {
            document.open(); document.write(plain); document.close(); return;
          }
        } catch (eGzip) { console.warn(eGzip); }
      }

      // Fallback: full original app from jsDelivr (commit with complete features)
      boot.textContent = 'تحميل النسخة الكاملة...';
      var res = await fetch('https://cdn.jsdelivr.net/gh/seddikia1-sketch/Mihrab@5538dc22/index.html', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var html = await res.text();
      if (!html || html.indexOf('loadMushafHizb') === -1) throw new Error('محتوى غير صالح');

      // Inject PDF.js engine + mushaf-pdf.js for Mohammadi pages support
      if (html.indexOf('pdf.min.js') === -1) {
        html = html.replace('</head>',
          '<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"><\/script>' +
          '<script>if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";}<\/script></head>'
        );
      }
      if (html.indexOf('mushaf-pdf.js') === -1) {
        html = html.replace('</body>', '<script src="./mushaf-pdf.js"><\/script></body>');
      }
      document.open(); document.write(html); document.close();
    } catch (e) {
      console.error(e);
      boot.innerHTML = 'تعذر التحميل التلقائي.<br><br>' +
        '<a href="https://cdn.jsdelivr.net/gh/seddikia1-sketch/Mihrab@5538dc22/index.html">فتح النسخة الكاملة</a><br><br>' +
        '<a href="https://github.com/seddikia1-sketch/Mihrab">المستودع على GitHub</a>';
    }
  })();
  </script>
</body>
</html>
